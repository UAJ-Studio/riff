import "protocol.proto";

package OstProto;

// EtherIP (RFC 3378) - Ethernet frames tunnelled in IP (protocol 97)
message EtherIp {
    optional uint32 version = 1 [default = 3];
    optional uint32 reserved = 2;
}

extend Protocol {
    optional EtherIp etherip = 406;
}
