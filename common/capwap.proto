import "protocol.proto";

package OstProto;

// CAPWAP (RFC 5415) - header, optionally followed by the control message
// header (control channel, UDP 5246). On the data channel (UDP 5247) with
// T = 0 the payload is an IEEE 802.3 frame.
message Capwap {
    optional uint32 version = 1;
    optional uint32 type = 2;                 // 0 = CAPWAP header
    optional uint32 hlen = 3;                 // 4-byte words
    optional bool   is_override_hlen = 4;
    optional uint32 rid = 5 [default = 1];    // radio ID
    optional uint32 wbid = 6 [default = 1];   // 1 = IEEE 802.11
    optional uint32 flags = 7;                // T F L W M K (bit 5..0)
    optional uint32 rsvd_flags = 8;
    optional uint32 fragment_id = 9;
    optional uint32 fragment_offset = 10;
    optional uint32 rsvd2 = 11;

    optional bool   is_control = 12;
    optional uint32 message_type = 13 [default = 13];  // Echo Request
    optional uint32 seq_num = 14;
    optional uint32 msg_elem_len = 15;
    optional bool   is_override_msg_elem_len = 16;
    optional uint32 msg_flags = 17;
}

extend Protocol {
    optional Capwap capwap = 407;
}
