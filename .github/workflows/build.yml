# Build Riff from source: the RiffWireless distro (Linux) and the Windows
# executables + installer. Every artifact of a release comes from this
# workflow, so anyone can check how it was built.
name: Build

on:
  push:
    branches: [main]
    tags: ['riff-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NPCAP_SDK: 1.15
  NPCAP_SDK_SHA256: 52c7b9fb4abee3ad9fe739bb545c3efe77b731c8e127122bdf328eafdae3ed4f
  USBIPD: 5.3.0
  USBIPD_SHA256: 1c984914aec944de19b64eff232421439629699f8138e3ddc29301175bc6d938

jobs:
  # One wireless pack (kernel modules + firmware) per Microsoft WSL kernel
  # Riff supports: the pack must match the kernel WSL runs exactly. Add a
  # line here when Microsoft ships a new WSL kernel.
  pack:
    name: Wireless pack ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - 6.6.87.2      # WSL 2.5 / 2.6
          - 6.18.54.1     # WSL 3.0.3
          - 6.18.58.1     # WSL 3.0.5
    steps:
      - uses: actions/checkout@v4

      # building a pack means building the kernel: keep it until the kernel
      # or the pack sources change
      - name: Cache wireless pack
        id: pack
        uses: actions/cache@v4
        with:
          path: wireless/packs
          key: pack-${{ matrix.kernel }}-${{ hashFiles('wireless/build-pack.sh', 'wireless/drivers.list', 'wireless/riff.defconfig', 'wireless/compat/**', 'wireless/riff-wifi-load.sh') }}

      - name: Build tools
        if: steps.pack.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q git curl zstd perl build-essential flex bison bc \
              libelf-dev libssl-dev kmod dwarves cpio rsync python3

      # the pruned kernel build (Module.symvers, headers, scripts) of each
      # kernel never changes: reused when only the pack sources change
      - name: Cache kernel tree
        id: kcache
        if: steps.pack.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pack/kernel-${{ matrix.kernel }}
          key: kernel-${{ matrix.kernel }}-v1

      - name: Wireless pack
        if: steps.pack.outputs.cache-hit != 'true'
        run: sudo env WORK="$RUNNER_TEMP/pack" bash wireless/build-pack.sh "${{ matrix.kernel }}"

      - name: Let the cache read the kernel tree
        if: always() && steps.pack.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "$RUNNER_TEMP/pack/kernel-${{ matrix.kernel }}" || true

      # saved even when the pack step failed: the next try skips the kernel
      - name: Save kernel tree
        if: always() && steps.pack.outputs.cache-hit != 'true' && steps.kcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pack/kernel-${{ matrix.kernel }}
          key: kernel-${{ matrix.kernel }}-v1

      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.kernel }}
          path: wireless/packs/riff-wifi-${{ matrix.kernel }}-microsoft-standard-WSL2.tar.zst
          if-no-files-found: error

  wireless:
    name: RiffWireless distro
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          path: wireless/packs
          merge-multiple: true

      - name: Build tools
        run: sudo apt-get install -y -q zstd curl

      - name: Distro rootfs
        run: |
          ls -l wireless/packs
          mkdir -p wireless/dist
          git archive -o wireless/dist/src.tar HEAD
          sudo env WORK="$RUNNER_TEMP/distro" bash wireless/build-distro.sh
          sudo chown -R "$(id -u):$(id -g)" wireless/dist

      - uses: actions/upload-artifact@v4
        with:
          name: riffwireless
          path: |
            wireless/dist/riffwireless-rootfs.tar.gz
            wireless/dist/riff-wifi-usbids.txt
            wireless/dist/riffwireless-version.txt
          if-no-files-found: error

  windows:
    name: Windows build
    needs: wireless
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false              # no module dependencies (no go.sum)

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit        # keep Go from setup-go
          update: true
          install: >-
            make unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-qt5-static
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Cache protobuf
        id: protobuf
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps/protobuf
          key: protobuf-3.21.12-ucrt64-${{ hashFiles('win/build-protobuf.sh') }}

      - name: protobuf 3.21.12
        if: steps.protobuf.outputs.cache-hit != 'true'
        run: DEPS="$(cygpath -u '${{ runner.temp }}')/deps" win/build-protobuf.sh

      - name: Npcap SDK
        run: |
          D="$(cygpath -u '${{ runner.temp }}')/deps"
          mkdir -p "$D" && cd "$D"
          curl -sSLf -o npcap-sdk.zip "https://npcap.com/dist/npcap-sdk-$NPCAP_SDK.zip"
          echo "$NPCAP_SDK_SHA256  npcap-sdk.zip" | sha256sum -c
          unzip -q -o npcap-sdk.zip -d npcap-sdk

      - name: Riff (static Qt)
        run: DEPS="$(cygpath -u '${{ runner.temp }}')/deps" win/build.sh

      - name: Wi-Fi extcap
        run: bash wireless/extcap/build.sh

      - uses: actions/download-artifact@v4
        with:
          name: riffwireless
          path: wireless/dist

      - name: Package
        run: win/package.sh

      - name: Installer (Inno Setup)
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          export ISCC
          MSI="$(cygpath -u "$RUNNER_TEMP")/usbipd.msi"
          curl -sSLf -o "$MSI" \
              "https://github.com/dorssel/usbipd-win/releases/download/v$USBIPD/usbipd-win_${USBIPD}_x64.msi"
          echo "$USBIPD_SHA256  $MSI" | sha256sum -c
          bash wireless/build-installer.sh "$MSI"
          sha256sum dist/Riff-*-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: riff-setup
          path: dist/Riff-*-setup.exe
          if-no-files-found: error

  # Tag riff-<version> (matching APP_VERSION in version.pri): publish the
  # GitHub release from here, with the installer under its versioned name and
  # as Riff-setup.exe (the Riff page downloads
  # releases/latest/download/Riff-setup.exe). Notes: .github/release-notes/<tag>.md
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/riff-')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: riff-setup
          path: out

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VER=${TAG#riff-}
          APP=$(sed -n 's/^APP_VERSION *= *//p' version.pri | head -1)
          [ "$VER" = "$APP" ] || { echo "tag $TAG does not match APP_VERSION $APP"; exit 1; }
          SETUP=out/Riff-$VER-setup.exe
          [ -f "$SETUP" ] || { echo "missing $SETUP"; exit 1; }
          cp "$SETUP" out/Riff-setup.exe
          NOTES=.github/release-notes/$TAG.md
          [ -f "$NOTES" ] || { echo "missing $NOTES"; exit 1; }
          SHA=$(sha256sum "$SETUP" | cut -d' ' -f1)
          sed "s/@SHA256@/$SHA/g" "$NOTES" > "$RUNNER_TEMP/notes.md"
          TITLE=$(head -1 "$RUNNER_TEMP/notes.md" | sed 's/^# *//')
          tail -n +2 "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/body.md"
          gh release create "$TAG" "$SETUP" out/Riff-setup.exe \
              --title "$TITLE" --notes-file "$RUNNER_TEMP/body.md" --verify-tag --latest
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | .name)'
