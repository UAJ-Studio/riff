# Build Riff from source: the RiffWireless distro (Linux) and the Windows
# executables + installer. Every artifact of a release comes from this
# workflow, so anyone can check how it was built.
name: Build

on:
  push:
    branches: [main]
    tags: ['riff-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WSL_KERNEL: 6.6.87.2      # Microsoft WSL kernel the wireless pack is built for
  NPCAP_SDK: 1.15
  NPCAP_SDK_SHA256: 52c7b9fb4abee3ad9fe739bb545c3efe77b731c8e127122bdf328eafdae3ed4f
  USBIPD: 5.3.0
  USBIPD_SHA256: 1c984914aec944de19b64eff232421439629699f8138e3ddc29301175bc6d938

jobs:
  wireless:
    name: RiffWireless distro
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q git curl zstd perl build-essential flex bison bc \
              libelf-dev libssl-dev kmod dwarves cpio rsync python3

      # The pack (kernel modules + firmware) only changes with the kernel
      # version or the pack sources; building it means building the kernel.
      - name: Cache wireless pack
        id: pack
        uses: actions/cache@v4
        with:
          path: wireless/packs
          key: pack-${{ env.WSL_KERNEL }}-${{ hashFiles('wireless/build-pack.sh', 'wireless/drivers.list', 'wireless/riff.defconfig', 'wireless/compat/**', 'wireless/riff-wifi-load.sh') }}

      - name: Wireless pack
        if: steps.pack.outputs.cache-hit != 'true'
        run: sudo env WORK="$RUNNER_TEMP/pack" bash wireless/build-pack.sh "$WSL_KERNEL"

      - name: Distro rootfs
        run: |
          mkdir -p wireless/dist
          git archive -o wireless/dist/src.tar HEAD
          sudo env WORK="$RUNNER_TEMP/distro" bash wireless/build-distro.sh
          sudo chown -R "$(id -u):$(id -g)" wireless/dist

      - uses: actions/upload-artifact@v4
        with:
          name: riffwireless
          path: |
            wireless/dist/riffwireless-rootfs.tar.gz
            wireless/dist/riff-wifi-usbids.txt
            wireless/dist/riffwireless-version.txt
          if-no-files-found: error

  windows:
    name: Windows build
    needs: wireless
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: wireless/extcap/go.sum

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit        # keep Go from setup-go
          update: true
          install: >-
            make unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-qt5-static
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Cache protobuf
        id: protobuf
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps/protobuf
          key: protobuf-3.21.12-ucrt64-${{ hashFiles('win/build-protobuf.sh') }}

      - name: protobuf 3.21.12
        if: steps.protobuf.outputs.cache-hit != 'true'
        run: DEPS="$(cygpath -u '${{ runner.temp }}')/deps" win/build-protobuf.sh

      - name: Npcap SDK
        run: |
          D="$(cygpath -u '${{ runner.temp }}')/deps"
          mkdir -p "$D" && cd "$D"
          curl -sSLf -o npcap-sdk.zip "https://npcap.com/dist/npcap-sdk-$NPCAP_SDK.zip"
          echo "$NPCAP_SDK_SHA256  npcap-sdk.zip" | sha256sum -c
          unzip -q -o npcap-sdk.zip -d npcap-sdk

      - name: Riff (static Qt)
        run: DEPS="$(cygpath -u '${{ runner.temp }}')/deps" win/build.sh

      - name: Wi-Fi extcap
        run: bash wireless/extcap/build.sh

      - uses: actions/download-artifact@v4
        with:
          name: riffwireless
          path: wireless/dist

      - name: Package
        run: win/package.sh

      - name: Installer
        run: |
          MSI="$(cygpath -u "$RUNNER_TEMP")/usbipd.msi"
          curl -sSLf -o "$MSI" \
              "https://github.com/dorssel/usbipd-win/releases/download/v$USBIPD/usbipd-win_${USBIPD}_x64.msi"
          echo "$USBIPD_SHA256  $MSI" | sha256sum -c
          bash wireless/build-installer.sh "$MSI"
          sha256sum dist/Riff-*-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: riff-setup
          path: dist/Riff-*-setup.exe
          if-no-files-found: error
